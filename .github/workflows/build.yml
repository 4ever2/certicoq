name: Compile and bench

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - "**"
  workflow_dispatch:
    inputs: {}

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        opam_file:
          - 'coq-certicoq.opam'
        image:
          - 'mattam82/metacoq:metarocq-1.4-rocq-9.0'
      fail-fast: false  # don't stop jobs if one fails
    steps:
      - uses: actions/checkout@v3
        with:
           submodules: false
      - uses: coq-community/docker-coq-action@v1
        with:
          custom_image: ${{ matrix.image }}
          opam_file: ${{ matrix.opam_file }}
          before_install: | # comment back in if MetaRocq commit changes
            startGroup "fix permission issues"
              sudo chown -R 1000:1000 .
            endGroup

            startGroup "opam pin"
              # TODO: this should be done in the Dockerfile
              opam update -y -u
              opam pin add -n -k version rocq-stdlib 9.0.0
              opam pin add -n -k version rocq-prover 9.1.0
              opam pin add -n -k version coqide-server 9.1.0
              opam pin add -n -k version coq-compcert 3.17
              opam pin add -n -k version rocq-equations 1.3.1+9.1
              opam pin add -n -k version coq-ext-lib 0.13.0
              opam pin add -n -k version rocq-metarocq 1.4.1+9.1
              opam pin add -n -k version coq-wasm 2.2.0
              opam install -y -j 4 rocq-prover coqide-server rocq-stdlib rocq-bignums rocq-equations rocq-metarocq coq-compcert coq-ext-lib coq-wasm
            endGroup
          before_script: |
            startGroup "Install more dependencies"
              # TODO: install node with apt once a more recent version is available for debian. We need at least version 22.
              sudo apt-get install --yes wabt
              # install node via https://github.com/nvm-sh/nvm
              curl https://raw.githubusercontent.com/nvm-sh/nvm/master/install.sh | bash
              export NVM_DIR="$HOME/.nvm"
              [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"  # This loads nvm
              nvm install 22.1.0
              node --version
            endGroup
            startGroup "fix permission issues"
              sudo chown -R 1000:1000 .
            endGroup
            startGroup "Copy repo (for later benchmarking)"
              cp -r `pwd` ~/repo
            endGroup
          after_script: |
            startGroup "List installed packages"
              opam list
            endGroup
            startGroup "Run benchmarks"
              ulimit -s unlimited
              make -C ~/repo/benchmarks all
            endGroup
            startGroup "Test bootstrapped plugins"
              cd ~/repo && ./configure.sh global
              make -C ~/repo/bootstrap test
            endGroup
